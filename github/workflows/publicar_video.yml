name: Publicar Video Viral

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video de Facebook a republicar'
        required: true
        type: string

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg  # Necesario para yt-dlp
        
    - name: Crear directorios
      run: mkdir -p data
      
    - name: Descargar y publicar video
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: python main_video.py "${{ github.event.inputs.video_url }}"
