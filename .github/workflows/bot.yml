name: Bot Noticias Video Nativo

on:
  schedule:
    - cron: '0 */2 * * *'  # Cada 2 horas (ajusta según necesites)
  workflow_dispatch:

jobs:
  publicar-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalar dependencias
      run: |
        pip install --upgrade pip
        pip install requests
        pip install yt-dlp
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Verificar instalación
      run: |
        yt-dlp --version
        ffmpeg -version | head -1
        
    - name: Crear directorio de datos
      run: mkdir -p data
      
    - name: Ejecutar Bot
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        YT_COOKIES: ${{ secrets.YT_COOKIES }}  # Cookies en base64
        HISTORIAL_PATH: data/historial_publicaciones.json
        ESTADO_PATH: data/estado_bot.json
      run: python bot.py
        
    - name: Guardar historial
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: historial-bot
        path: data/
        retention-days: 30
