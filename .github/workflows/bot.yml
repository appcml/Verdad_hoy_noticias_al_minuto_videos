name: Bot Noticias Video

on:
  schedule:
    - cron: '0 */1 * * *'  # Cada hora
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias Python
        run: |
          pip install requests feedparser beautifulsoup4 lxml isodate pillow
      
      - name: Instalar yt-dlp y ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp
      
      - name: Ejecutar Bot
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python bot.py
