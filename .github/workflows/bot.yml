name: Bot de Noticias - Publicación Automática

on:
  schedule:
    - cron: '0 * * * *'  # Cada 1 hora
  workflow_dispatch:  # Permite ejecución manual

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Crear directorios
      run: |
        mkdir -p temp
        mkdir -p data
    
    - name: Listar artifacts disponibles
      id: list-artifacts
      run: |
        echo "Artifacts disponibles:"
        gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].name' || echo "No se pudieron listar artifacts"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: Descargar base de datos anterior (si existe)
      id: download-db
      run: |
        # Intentar descargar con gh CLI en lugar de la action
        gh run download --name videos-db --dir data/ || echo "No se encontró artifact videos-db, se creará nueva base de datos"
        ls -la data/ || echo "Directorio data vacío"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: Verificar base de datos
      run: |
        if [ -f "data/videos.db" ]; then
          echo "✓ Base de datos encontrada"
          ls -lh data/videos.db
        else
          echo "✗ Base de datos no encontrada, inicializando..."
          # La base de datos se creará automáticamente cuando el bot se ejecute
        fi
    
    - name: Ejecutar bot
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: python bot.py
    
    - name: Verificar si se creó base de datos
      run: |
        if [ -f "data/videos.db" ]; then
          echo "✓ Base de datos lista para guardar"
          ls -lh data/videos.db
        else
          echo "✗ No se creó base de datos"
          exit 1
        fi
    
    - name: Guardar base de datos
      uses: actions/upload-artifact@v4
      with:
        name: videos-db
        path: data/videos.db
        retention-days: 30
        if-no-files-found: error
    
    - name: Limpiar archivos temporales
      run: rm -rf temp/*
