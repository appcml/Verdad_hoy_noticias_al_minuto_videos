name: Bot de Noticias - Publicación Automática

on:
  schedule:
    - cron: '0 * * * *'  # Cada 1 hora
  workflow_dispatch:  # Permite ejecución manual

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Crear directorios
      run: |
        mkdir -p temp
        mkdir -p data
    
    - name: Descargar base de datos anterior
      id: download-db
      uses: actions/download-artifact@v4
      with:
        name: videos-db
        path: data/
      continue-on-error: true
    
    - name: Verificar si existe base de datos
      run: |
        if [ -f "data/videos.db" ]; then
          echo "Base de datos encontrada"
        else
          echo "Base de datos no encontrada, se creará nueva"
          touch data/videos.db
        fi
    
    - name: Ejecutar bot
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: python bot.py
    
    - name: Guardar base de datos
      uses: actions/upload-artifact@v4
      with:
        name: videos-db
        path: data/videos.db
        retention-days: 30
        if-no-files-found: warn
    
    - name: Limpiar archivos temporales
      run: rm -rf temp/*
