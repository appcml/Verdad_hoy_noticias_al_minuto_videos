name: Bot de Noticias - Publicación Automática

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Instalar dependencias
      run: |
        pip install yt-dlp requests python-dotenv facebook-sdk
        sudo apt-get update && sudo apt-get install -y ffmpeg
    
    - name: Crear directorios
      run: mkdir -p temp data
    
    - name: Ejecutar bot
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: |
        echo "=== INICIANDO BOT ==="
        python -u bot.py
        echo "=== BOT FINALIZADO ==="
    
    - name: Limpiar
      if: always()
      run: rm -rf temp/*
