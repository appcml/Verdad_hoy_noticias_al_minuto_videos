name: Bot Noticias Video

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Asegurar que se descarga todo
      
      - name: Verificar archivos descargados
        run: |
          echo "=== CONTENIDO DEL REPOSITORIO ==="
          ls -la
          echo "=== BUSCANDO bot.py ==="
          find . -name "bot.py" -type f 2>/dev/null || echo "No encontrado"
          echo "=== DIRECTORIO ACTUAL ==="
          pwd
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          pip install requests feedparser pytube
      
      - name: Instalar yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
      
      - name: Ejecutar Bot
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          # Verificar que bot.py existe antes de ejecutar
          if [ -f "bot.py" ]; then
            python bot.py
          else
            echo "❌ ERROR: bot.py no encontrado"
            exit 1
          fi
