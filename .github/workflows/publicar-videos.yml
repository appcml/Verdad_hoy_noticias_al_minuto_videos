name: Bot Verdad Hoy - Automatico

on:
  schedule:
    - cron: '0 * * * *'  # Cada 60 minutos
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs de videos (una por línea, máx 15)'
        required: false
        type: string

jobs:
  procesar:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Crear directorios
      run: mkdir -p data
      
    - name: Cargar cola anterior
      uses: actions/download-artifact@v4
      with:
        name: cola-videos
        path: data/
      continue-on-error: true
      
    - name: Agregar URLs a cola
      if: github.event.inputs.urls != ''
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: |
        echo "Procesando múltiples URLs..."
        python -c "
        import sys
        sys.path.insert(0, '.')
        from src.cola_processor import ProcesadorCola
        
        urls = '''${{ github.event.inputs.urls }}'''
        procesador = ProcesadorCola()
        
        contador = 0
        for url in urls.strip().split('\n'):
            url = url.strip()
            if url and contador < 15:
                print(f'Agregando: {url[:50]}...')
                if procesador.agregar_a_cola(url, 'usuario'):
                    contador += 1
        print(f'Total agregados: {contador}')
        "
      
    - name: Procesar cola (máx 15 videos)
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from src.cola_processor import ProcesadorCola
        
        procesador = ProcesadorCola()
        print('Procesando videos en cola...')
        
        procesados = 0
        while procesados < 15:
            success, estado = procesador.procesar_siguiente()
            if estado == 'cola_vacia':
                print('Cola vacía')
                break
            if success:
                procesados += 1
                print(f'Procesado {procesados}/15')
            else:
                print('Error en video, continuando...')
        
        print(f'Total procesados: {procesados}')
        "
      
    - name: Guardar cola
      uses: actions/upload-artifact@v4
      with:
        name: cola-videos
        path: data/
        retention-days: 7
