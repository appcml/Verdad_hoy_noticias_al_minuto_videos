name: Bot Videos - Cada 1 hora

on:
  schedule:
    # Ejecutar cada hora en el minuto 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Instalar FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Ejecutar bot de videos
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        HISTORIAL_PATH: data/historial_videos.json
        ESTADO_PATH: data/estado_bot.json
      run: python bot_videos.py
        
    - name: Guardar historial
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        git diff --staged --quiet || git commit -m "🎬 Actualizar historial [$(date +%Y-%m-%d_%H:%M)]"
        git push
