name: Bot Reels - Publicar Videos

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser yt-dlp
      
      - name: Verificar secrets (debug)
        run: |
          echo "Verificando variables de entorno..."
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then echo "❌ YOUTUBE_API_KEY no configurado"; exit 1; fi
          if [ -z "${{ secrets.FB_ACCESS_TOKEN }}" ]; then echo "❌ FB_ACCESS_TOKEN no configurado"; exit 1; fi
          if [ -z "${{ secrets.FB_PAGE_ID }}" ]; then echo "❌ FB_PAGE_ID no configurado"; exit 1; fi
          echo "✅ Todos los secrets están configurados"
      
      - name: Ejecutar bot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          cd $GITHUB_WORKSPACE
          python bot_reels.py
