name: Bot Verdad Hoy - Automatico

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs de videos (una por línea)'
        required: true
        type: string

jobs:
  procesar:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        sudo apt-get install -y ffmpeg
        
    - name: Crear directorios
      run: mkdir -p data
      
    - name: PRUEBA - Verificar archivos Python
      run: |
        echo "=== Archivos en src/ ==="
        ls -la src/
        echo ""
        echo "=== Contenido de __init__.py ==="
        cat src/__init__.py 2>/dev/null || echo "NO EXISTE __init__.py"
        echo ""
        echo "=== Probando import ==="
        python -c "import sys; sys.path.insert(0, '.'); from src.cola_processor import ProcesadorCola; print('Import OK')"
      
    - name: Agregar y procesar URLs
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: |
        python << 'EOF'
        import sys
        sys.path.insert(0, '.')
        
        print("Importando módulos...")
        try:
            from src.cola_processor import ProcesadorCola
            from src.utils import log
            print("✓ Import exitoso")
        except Exception as e:
            print(f"✗ Error import: {e}")
            import traceback
            traceback.print_exc()
            sys.exit(1)
        
        urls_text = """${{ github.event.inputs.urls }}"""
        urls = [u.strip() for u in urls_text.strip().split('\n') if u.strip()]
        print(f"URLs detectadas: {len(urls)}")
        
        if not urls:
            print("ERROR: No hay URLs")
            sys.exit(1)
        
        procesador = ProcesadorCola()
        
        # Agregar
        for url in urls[:15]:
            print(f"Agregando: {url[:50]}...")
            try:
                procesador.agregar_a_cola(url, 'usuario')
            except Exception as e:
                print(f"Error agregando: {e}")
        
        # Procesar
        print("\nProcesando...")
        for i in range(15):
            try:
                success, estado = procesador.procesar_siguiente()
                print(f"[{i+1}] Estado: {estado}, Success: {success}")
                if estado == 'cola_vacia':
                    break
            except Exception as e:
                print(f"Error procesando: {e}")
                import traceback
                traceback.print_exc()
                break
        
        print("Terminado")
        EOF
