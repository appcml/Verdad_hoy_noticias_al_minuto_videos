name: Bot Verdad Hoy - Automatico

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video de Facebook'
        required: false
        type: string

jobs:
  procesar:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Crear directorios
      run: mkdir -p data
      
    - name: Cargar cola anterior
      uses: actions/download-artifact@v4
      with:
        name: cola-videos
        path: data/
      continue-on-error: true
      
    - name: Agregar URL (si se proporcionó)
      if: github.event.inputs.video_url != ''
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: python main_automatico.py "${{ github.event.inputs.video_url }}"
      
    - name: Procesar cola
      env:
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      run: python main_automatico.py
      
    - name: Guardar cola
      uses: actions/upload-artifact@v4
      with:
        name: cola-videos
        path: data/
        retention-days: 7
